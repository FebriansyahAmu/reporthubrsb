# =============================================================================
# ReportHub RSB (AuditTrail RS BOLTIM). Pola sama seperti deploy lain:
# bind ke 127.0.0.1 (di balik reverse proxy), env dari .env, restart & healthcheck.
# Port host 3003 (3001=antrian, 3002=fhir sudah dipakai).
# =============================================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: reporthubrsb-app:1.0.0
    container_name: reporthubrsb-app
    restart: unless-stopped
    # Semua kredensial/secret (DATABASE_URL_SIMGOS, SIMGOS_PASSWORD_KEY,
    # DATABASE_URL_APP, AUTH_*, dll.) dibaca dari .env saat runtime.
    # SIGN_PUBLIC_ORIGIN / PUBLIC_APP_ORIGIN = alamat yang dijangkau PC klien;
    # URL unduhan pembaruan aplikasi desktop dibuat dari situ → WAJIB sama dengan
    # REPORTHUB_URL yang ditanam di installer.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      STORAGE_DIR: /app/storage
    # Berkas aplikasi di disk, metadata di DB: sisipan & PDF Paket Klaim
    # (storage/klaim/<nopen>/…) dan foto barang Inventaris
    # (storage/inventaris/foto/<KODE>/…). Folder biasa di samping file ini →
    # bisa dibuka & di-backup langsung. SEKALI di server, sebelum `up`:
    #   mkdir -p storage && sudo chown -R 1001:1001 storage
    # (container berjalan sebagai nextjs UID 1001; tanpa chown unggahan gagal
    # dengan pesan "Folder penyimpanan berkas tidak bisa ditulis server").
    # Pindahan dari named volume lama `reporthubrsb-storage` (bila pernah dipakai),
    # jalankan SEBELUM chown di atas:
    #   docker run --rm -v reporthubrsb-storage:/dari -v "$PWD/storage":/ke alpine cp -a /dari/. /ke/
    volumes:
      - ./storage:/app/storage
      # Rilis aplikasi desktop (installer Windows + rilis.json) — dibangun &
      # ditandatangani di PC Windows (`npm run rilis` di desktop/), diterbitkan
      # ke folder host ini dengan `sh scripts/desktop/terbitkan.sh <folder-rilis>`.
      # READ-ONLY bagi app: server hanya menyajikannya (tombol unduh di halaman
      # masuk & menu pengguna, pembaruan otomatis); app yang dibobol pun tak bisa
      # mengganti installer yang diunduh petugas. Lihat docs/desktop-tauri.md §4.
      - ./storage/desktop:/app/storage/desktop:ro
    ports:
      - "127.0.0.1:3003:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Migrasi DB (one-off). TIDAK ikut `docker compose up` (profile "tools").
  # Memakai image runtime yang sama; folder scripts/ di-mount (tak ada di image
  # standalone) dan env DATABASE_URL_APP disuntik dari .env (env_file).
  # Pakai:
  #   docker compose build
  #   docker compose run --rm migrate      # inventaris: base → katalog → checklist
  #   docker compose up -d
  # ---------------------------------------------------------------------------
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    image: reporthubrsb-app:1.0.0
    container_name: reporthubrsb-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - ./scripts:/app/scripts:ro
    entrypoint: ["node"]
    command: ["scripts/db/migrate-inventaris-all.mjs"]
