[package]
name = "audittrail-rsboltim"
version = "1.0.0"
description = "Jendela desktop AuditTrail RS BOLTIM — membuka server ReportHub (WebView2)"
authors = ["UPTD RSUD Bolaang Mongondow Timur"]
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "audittrail_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tanpa fitur "devtools": inspektor tidak ikut di build rilis.
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.13"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
url = "2"

# Pengaturan WebView2 yang tak diekspos Tauri (penyimpanan kata sandi) — versi = milik wry.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
